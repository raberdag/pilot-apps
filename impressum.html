<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            text-align: center; 
            padding: 40px 20px; 
            font-family: sans-serif;
        }
        img { 
            /* Standard: Auf Handys fast volle Breite */
            max-width: 90%;       
            height: auto;         
            border: 2px solid #f97316; 
            border-radius: 8px;   
            margin-bottom: 30px;
        }

        /* Ab einer Bildschirmbreite von 768px (Tablets/PCs) 
           wird das Bild auf maximal 50% verkleinert */
        @media (min-width: 768px) {
            img {
                max-width: 50%;
            }
        }

        .back-button { 
            display: inline-block; 
            padding: 12px 25px; 
            background-color: #f97316; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .back-button:hover { background-color: #ea580c; }
    </style>
</head>
<body>

    <img src="impressum.jpg" alt="Impressum">
    
    <br>
    
    <a href="index.html" class="back-button">← Zurück</a>

</body>
</html>
