<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugzeug Checklisten Master-App</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        header {
            background: #111827;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 20px));
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid #1e293b;
        }
        .container {
            padding: 15px;
            padding-bottom: 90px;
        }
        h2 {
            font-size: 1.3rem;
            color: #f8fafc;
            margin-top: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        /* Haupt- und Untermenü-Karten */
        .card {
            background: #1e293b;
            padding: 20px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #334155;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            transition: background 0.2s, transform 0.1s, border-color 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }

        /* Normalcheckliste blau */
        .card-normal {
            background: #1e3a8a !important;
            border: 1px solid #3b82f6 !important;
        }
        .card-normal:active {
            background: #1d4ed8 !important;
        }

        /* Notcheckliste rot */
        .card-emergency {
            background: #7f1d1d !important;
            border: 1px solid #dc2626 !important;
        }
        .card-emergency:active {
            background: #b91c1c !important;
        }

        .title-normal {
            color: #93c5fd !important;
        }
        .title-emergency {
            color: #fca5a5 !important;
        }

        /* Header innerhalb von Listen */
        .section-title {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
	    color: yellow; /* Macht alle Überschriften im Cockpit schön gelb */
        }

        #copyright-footer {
            color: #94a3b8;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            line-height: 1.4;
            border-top: 1px solid #1e293b;
        }

        /* Listeneinträge */
        .item {
            background: #1f2937;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            transition: opacity 0.2s, border-color 0.2s;
            word-break: break-word;
            border: 1px solid #374151;
        }

        .item.mode-normal {
            border-left: 5px solid #3b82f6;
        }
        .item.mode-emergency {
            border-left: 5px solid #dc2626;
        }

        .item.done {
            opacity: 0.15;
        }
        .item-left {
            font-weight: bold;
            text-align: left;
            flex: 1;
            padding-right: 10px;
            min-width: 55%;
        }
        .item-right {
            color: #38bdf8;
            text-align: right;
            font-weight: bold;
            word-break: keep-all;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111827;
            padding: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }
        button {
            flex: 1;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background: #2563eb;
        }
        .item.mode-emergency .item-right {
            color: #fdba74;
        }

        /* Kommentar/Anweisung unter dem Linken Text */
        .comment {
            display: block;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
            font-style: italic;
            text-align: left;
        }

        /* Feste Fußzeile */
        .bottom {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            gap: 8px;
            background: #111827;
            padding: 10px;
            box-sizing: border-box;
            border-top: 1px solid #1e293b;
            z-index: 2000;
        }
        .bottom button {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .home { background: #2563eb; }
        .menu { background: #059669; }
        .reset { background: #dc2626; }
    </style>
</head>

                    "Gemisch – SCHNELLSTOPP", "Elektrische Kraftstoffpumpe – AUS", "Heizung/Enteisung – AUS",
                    "Hauptschalter – AUS (FALLS FUNK NICHT ERFORDERLICH)", "Landung – MIT STEHENDEM TRIEBWERK DURCHFÜHREN"
                ],
                "4. Systemfehler (Öl / Kraftstoff / Strom)": [
                    "[HEADER] ÖLDRUCKVERLUST", "Nächsten Flugplatz – ANFLIEGEN", " - Mit Motorausfall rechnen",
                    "Leistung – NICHT UNNÖTIG VERÄNDERN", "Falls Motor stoppt – LANDUNG MIT STEHENDEM TRIEBWERK",
                    "[HEADER] ZU HOHE ÖLTEMPERATUR", "Landen – AUF NÄCHSTEM GEEIGNETEN FLUGPLATZ",
                    "Ursache – PRÜFEN LASSEN", "Öldruck – BEOBACHTEN", "Vorbereitung – AUF LANDUNG MIT STEHENDEM TRIEBWERK",
                    "[HEADER] KRAFTSTOFFDRUCKABFALL", "Elektrische Kraftstoffpumpe – EIN",
                    "Tankwahlventil – AUF VOLLSTEN TANK SCHALTEN", "Landung – SO BALD WIE MÖGLICH",
                    "[HEADER] GENERATORAUSFALL (WARNLEUCHTE)", "Verbraucher einschalten und – AMPEREMETER PRÜFEN",
                    "Elektrische Last – MINIMIEREN", "Generatorschutzschalter – PRÜFEN", "Generatorschalter – AUS -> EIN",
                    "Generatorschalter (falls keine Besserung) – AUS", "Batterieschalter – WIE ERFORDERLICH",
                    "Elektrische Last – MINIMIEREN", "Landung – SO BALD WIE MÖGLICH"
                ],
                "5. Kabinen-Vorfälle": [
                    "[HEADER] OFFENE KABINENTÜR", "Geschwindigkeit – 87–89 KIAS", "Kabinenbelüftung – SCHLIESSEN",
                    "Schlechtwetterfenster – ÖFFNEN", "Obere Verriegelung – SCHLIESSEN",
                    "Seitliche Verriegelung – SCHLIESSEN", "Bei beiden offen – ERST SEITLICH, DANN OBEN VERRIEGELN"
                ]
            }
        }
    };

    let currentAircraft = null;
    let currentGroup = null;

    function home() {
        currentAircraft = null;
        currentGroup = null;
        const app = document.getElementById("app");
        app.innerHTML = "<h2>Flugzeug auswählen</h2>";

        const order = ["Cessna 150-172", "TB-10", "TB-20", "PA28-161 Cadet", "PA28-181 Archer II"];

        order.forEach(name => {
            if (checklistData[name]) {
                const div = document.createElement("div");
                div.className = "card";
                div.innerText = name;
                div.onclick = () => aircraftMenu(name);
                app.appendChild(div);
            }
        });

        const footer = document.createElement("div");
        footer.id = "copyright-footer";
        footer.innerHTML = "© 2026 A.Schlagintweit <br>Erstellt für den privaten Gebrauch und Schulungszwecke.";
        app.appendChild(footer);
    }

    function aircraftMenu(name) {
        currentAircraft = name;
        currentGroup = null;
        const app = document.getElementById("app");
        app.innerHTML = `<h2>${name}</h2>`;

        const hasNormal = checklistData[name]["Normalcheckliste"] !== undefined;
        const hasEmergency = checklistData[name]["Not-Checkliste"] !== undefined;

        if (hasNormal) {
            const normalDiv = document.createElement("div");
            normalDiv.className = "card card-normal";
            normalDiv.innerText = "Normalcheckliste";
            normalDiv.onclick = () => chapterMenu(name, "Normalcheckliste");
            app.appendChild(normalDiv);
        }

        if (hasEmergency) {
            const emergencyDiv = document.createElement("div");
            emergencyDiv.className = "card card-emergency";
            emergencyDiv.innerText = "Not-Checkliste";
            emergencyDiv.onclick = () => chapterMenu(name, "Not-Checkliste");
            app.appendChild(emergencyDiv);
        }

        if (hasNormal && !hasEmergency) {
            chapterMenu(name, "Normalcheckliste");
        }
    }

    function chapterMenu(aircraft, group) {
        currentAircraft = aircraft;
        currentGroup = group;
        const app = document.getElementById("app");

        const titleClass = (group === "Not-Checkliste") ? "title-emergency" : "title-normal";
        app.innerHTML = `<h2 class="${titleClass}">${aircraft}<br><span style='font-size:1.1rem; font-weight:normal;'>${group}</span></h2>`;

        const chapters = Object.keys(checklistData[aircraft][group]);
        chapters.forEach(ch => {
            const div = document.createElement("div");
            div.className = "card";
            div.innerText = ch;
            div.onclick = () => showChecklist(aircraft, group, ch);
            app.appendChild(div);
        });
    }

    function showChecklist(aircraft, group, chapter) {
        const app = document.getElementById("app");
        const titleClass = (group === "Not-Checkliste") ? "title-emergency" : "title-normal";
        const modeClass = (group === "Not-Checkliste") ? "mode-emergency" : "mode-normal";

        app.innerHTML = `<h2 class="${titleClass}">${aircraft}<br><span style='font-size:1rem; font-weight:normal;'>${chapter}</span></h2>`;

        const items = checklistData[aircraft][group][chapter];
        const doneStorageKey = `globalDoneChecklistItems`;
        let currentDone = JSON.parse(localStorage.getItem(doneStorageKey)) || [];

        items.forEach((itemText) => {
    if (itemText.startsWith("[HEADER]")) {
        const headerText = itemText.replace("[HEADER]", "").trim();
        const headerDiv = document.createElement("div");
        headerDiv.className = "section-title";

        // HIER IST DIE NEUE ZEILE: Sie erzwingt das Gelb im Cockpit!
        headerDiv.style.color = "yellow";

        headerDiv.innerText = headerText;
        app.appendChild(headerDiv);
        return;
            }

            const div = document.createElement("div");
            div.className = `item ${modeClass}`;

            const uniqueId = `${aircraft}-${group}-${chapter}-${itemText}`;
            if (currentDone.includes(uniqueId)) {
                div.classList.add("done");
            }

            div.innerHTML = renderItemSplit(itemText);

            // Keine Klick-Funktion für reine Infozeilen oder Warnungen
            if (!itemText.includes("Sofort und gleichzeitig durchführen") && !itemText.includes("Falls Störung bestehen bleibt") && !itemText.includes("WARNUNG:")) {
                div.onclick = () => {
                    let doneList = JSON.parse(localStorage.getItem(doneStorageKey)) || [];
                    if (div.classList.contains("done")) {
                        div.classList.remove("done");
                        doneList = doneList.filter(id => id !== uniqueId);
                    } else {
                        div.classList.add("done");
                        doneList.push(uniqueId);
                    }
                    localStorage.setItem(doneStorageKey, JSON.stringify(doneList));
                };
            }

            app.appendChild(div);
        });
    }

    function renderItemSplit(text) {
        let separator = "";
        if (text.includes(" – ")) {
            separator = " – ";
        } else if (text.includes(" - ")) {
            separator = " - ";
        } else if (text.includes(" : ")) {
            separator = " : ";
        } else if (text.includes(" :")) {
            separator = " :";
        }

        if (separator !== "") {
            const parts = text.split(separator);
            const leftPart = parts[0].trim();
            const rightPart = parts.slice(1).join(separator).trim();

            return `<div class="item-left">${leftPart}</div><div class="item-right">${rightPart}</div>`;
        }

        return `<div class="item-left">${text}</div>`;
    }

    function resetAll() {
    const modal = document.getElementById("resetModal");
    modal.style.display = "flex";
}

function closeResetModal(confirmReset) {
    document.getElementById("resetModal").style.display = "none";
    if (confirmReset) {
        localStorage.removeItem("globalDoneChecklistItems");
        document.querySelectorAll(".item").forEach(el => {
            el.classList.remove("done");
        });
    }
}

    function backMenu() {
        if (currentGroup && currentAircraft) {
            const hasEmergency = checklistData[currentAircraft]["Not-Checkliste"] !== undefined;
            if (!hasEmergency && currentGroup === "Normalcheckliste") {
                home();
            } else {
                chapterMenu(currentAircraft, currentGroup);
            }
        } else if (currentAircraft) {
            aircraftMenu(currentAircraft);
        } else {
            home();
        }
    }

    home();
</script>
